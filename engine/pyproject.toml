[project]
name = "editeur-engine"
version = "0.1.0"
description = "Analyse locale des rushs : transcription, visage, rythme, nettoyage audio"
requires-python = "==3.12.*"
dependencies = [
  "torch",
  "torchaudio",
  "faster-whisper",
  "mediapipe",
  "librosa",
  "soundfile",
  "numpy",
  "python-docx>=1.2.0",
  "open-clip-torch>=3.3.0",
  "scenedetect>=0.7.1",
  "opentimelineio>=0.18.1",
  "torchvision>=0.26.0",
  "otio-fcp-adapter>=1.0.0",
  "otio-fcpx-xml-adapter>=1.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
